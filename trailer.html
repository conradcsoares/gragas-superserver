<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gragas Superserver Trailer</title>
  <meta name="description" content="Hype trailer for the Gragas Superserver customs ladder.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 2 36 11v18L20 38 4 29V11Z' fill='%23c8aa6e'/%3E%3Cpath d='M20 9 29 14v12l-9 5-9-5V14Z' fill='%230a0e17'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@500;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05070d; --text: #e8ebf2; --muted: #8892a8; --gold: #c8aa6e; --border: #222d44; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 14px; }
    .stage { position: relative; width: min(100%, 1100px); aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 1px var(--border); }
    canvas { display: block; width: 100%; height: 100%; }
    .cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 45%, rgba(200,170,110,.18), rgba(0,0,0,.75) 70%); border: 0; cursor: pointer; color: inherit; font: inherit; }
    .cover[hidden] { display: none; }
    .play { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--gold); display: grid; place-items: center; background: rgba(5,7,13,.6); transition: transform .15s; }
    .cover:hover .play { transform: scale(1.07); }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .btn { display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #172033; color: var(--text); font: 600 14px Inter, sans-serif; cursor: pointer; text-decoration: none; }
    .btn:hover { border-color: var(--gold); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.gold { background: var(--gold); border-color: var(--gold); color: #14110a; }
    .note { color: var(--muted); font-size: 13px; text-align: center; max-width: 560px; margin: 0; min-height: 1.5em; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="cv" width="1280" height="720"></canvas>
    <button class="cover" id="cover" aria-label="Play trailer"><span class="play"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#c8aa6e"/></svg></span></button>
  </div>
  <div class="bar">
    <a class="btn" href="./">← Ladder</a>
    <button class="btn" id="replay">↻ Replay</button>
    <button class="btn gold" id="save">⬇ Save as video</button>
  </div>
  <p class="note" id="note">Sound on.</p>

  <script src="core.js?v=31"></script>
  <script src="emblems.js?v=31"></script>
  <script>
  'use strict';
  const W = 1280, H = 720, LEN = 25;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = s => document.querySelector(s);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeIn = x => x * x * x;
  const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

  // ---------- data ----------
  let stats = { ladder: [], games: 0 }, icons = [];
  async function loadData() {
    try {
      const r = await fetch(`data/league.json?t=${Date.now()}`, { cache: 'no-store' });
      const d = normalize(await r.json()), s = compute(d);
      if (d.settings.crownImg) await loadCrownImg(d.settings.crownImg);
      stats = { ladder: s.ladder, games: d.games.length };
    } catch { /* trailer still plays without names */ }
  }
  function loadIcons() {
    return Promise.all(RANKS.map((_, i) => new Promise(res => {
      const img = new Image();
      img.onload = () => res(img); img.onerror = () => res(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(emblemSvg(i));
    }))).then(a => { icons = a; });
  }

  // ---------- timeline ----------
  const CLIMB0 = 6.2, STEP = 0.28;              // rank climb: one emblem every STEP seconds
  const CLIMB1 = CLIMB0 + STEP * RANKS.length;  // ≈ 10.1
  const TOP0 = 12.6, TOPSTEP = 2.2;             // top-3 countdown
  const HITS = [0.25, 1.15, 2.05, 3.2, CLIMB1 + 0.05, 10.9, TOP0, TOP0 + TOPSTEP, TOP0 + TOPSTEP * 2, 19.4, 21.8];

  // ---------- drawing helpers ----------
  function text(str, x, y, { size = 60, font = 'Inter', weight = 900, color = '#fff', align = 'center', alpha = 1, glow = 0, glowColor = color, track = 0, max = 1160 } = {}) {
    ctx.save();
    ctx.globalAlpha = clamp(alpha);
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    let s = size;
    const setFont = () => { ctx.font = `${weight} ${s}px ${font}, Inter, sans-serif`; if ('letterSpacing' in ctx) ctx.letterSpacing = `${track * s}px`; };
    setFont();
    while (ctx.measureText(str).width > max && s > 12) { s -= 2; setFont(); }
    if (glow) { ctx.shadowColor = glowColor; ctx.shadowBlur = glow; }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    ctx.restore();
  }
  function icon(i, x, y, size, alpha = 1, glow = 0) {
    const img = icons[i]; if (!img) return;
    ctx.save(); ctx.globalAlpha = clamp(alpha);
    if (glow) { ctx.shadowColor = RANKS[i].color; ctx.shadowBlur = glow; }
    ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
    ctx.restore();
  }
  // deterministic pseudo-random so a recording looks the same every time
  const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  function background(t, tint) {
    const g = ctx.createRadialGradient(W / 2, H * 0.45, 40, W / 2, H / 2, W * 0.7);
    g.addColorStop(0, tint ? tint + '24' : '#151b2c');
    g.addColorStop(1, '#030409');
    ctx.fillStyle = g; ctx.fillRect(-40, -40, W + 80, H + 80);
    // embers drifting upward
    for (let k = 0; k < 70; k++) {
      const sp = 20 + rnd(k) * 60, x = rnd(k + 1) * W + Math.sin(t * 0.7 + k) * 14;
      const y = H + 20 - ((rnd(k + 2) * H + t * sp) % (H + 40));
      ctx.globalAlpha = 0.15 + rnd(k + 3) * 0.45;
      ctx.fillStyle = k % 3 ? '#c8aa6e' : (tint || '#ef7a3a');
      ctx.beginPath(); ctx.arc(x, y, 0.8 + rnd(k + 4) * 2, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function overlay(t) {
    // flash on every hit, scanlines, vignette, letterbox bars
    let flash = 0;
    for (const h of HITS) if (t >= h) flash = Math.max(flash, Math.exp(-(t - h) * 9) * 0.35);
    if (flash > 0.01) { ctx.fillStyle = `rgba(255,236,200,${flash})`; ctx.fillRect(0, 0, W, H); }
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.75)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 54); ctx.fillRect(0, H - 54, W, 54);
    const fadeIn = 1 - seg(t, 0, 0.25), fadeOut = seg(t, LEN - 1.2, LEN);
    if (fadeIn + fadeOut > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.max(fadeIn, fadeOut)})`; ctx.fillRect(0, 0, W, H); }
  }
  function shake(t) {
    let a = 0;
    for (const h of HITS) if (t >= h) a = Math.max(a, Math.exp(-(t - h) * 7));
    return [Math.sin(t * 93) * a * 9, Math.cos(t * 71) * a * 7];
  }
  const shortName = p => (p ? displayName(p) : '');

  // ---------- scenes ----------
  function frame(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const climbI = Math.min(RANKS.length - 1, Math.floor((t - CLIMB0) / STEP));
    const tint = t >= CLIMB0 && t < CLIMB1 + 0.5 ? RANKS[Math.max(0, climbI)].color
      : t >= 10.6 && t < TOP0 ? RANKS[CROWN].color
      : t >= TOP0 && t < TOP0 + TOPSTEP * 3 ? (() => { const p = stats.ladder[2 - Math.floor((t - TOP0) / TOPSTEP)]; return p ? RANKS[rankOf(p.rating, 2 - Math.floor((t - TOP0) / TOPSTEP))].color : null; })()
      : null;
    const [sx, sy] = shake(t);
    ctx.setTransform(1, 0, 0, 1, sx, sy);
    background(t, tint);

    // 1. cold open
    if (t < 3.1) {
      const lines = ['TEN PLAYERS.', 'ONE LOBBY.', 'NO MERCY.'];
      lines.forEach((s, k) => {
        const a = 0.25 + k * 0.9, p = seg(t, a, a + 0.35);
        if (p <= 0) return;
        text(s, W / 2, 250 + k * 110, { size: 92 * (1.25 - 0.25 * easeOut(p)), alpha: p * (1 - seg(t, 2.8, 3.1)), track: 0.04, color: k === 2 ? '#ef5a5f' : '#f0e6d2', glow: k === 2 ? 30 : 0 });
      });
    }
    // 2. title
    else if (t < CLIMB0) {
      const p = seg(t, 3.2, 3.9), out = seg(t, 5.7, CLIMB0);
      const sc = 1.3 - 0.3 * easeOut(p);
      text('GRAGAS', W / 2, 290, { size: 150 * sc, font: 'Cinzel', alpha: p * (1 - out), color: '#f0e6d2', glow: 40, glowColor: '#c8aa6e', track: 0.06 });
      text('SUPERSERVER', W / 2, 420, { size: 104 * sc, font: 'Cinzel', alpha: p * (1 - out), color: '#c8aa6e', glow: 24, track: 0.08 });
      // light sweep
      const sw = seg(t, 3.6, 4.6);
      if (sw > 0 && sw < 1) {
        const x = -300 + sw * (W + 600), g = ctx.createLinearGradient(x - 120, 0, x + 120, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,240,210,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }
      text('RANKED  CUSTOMS  ·  5V5', W / 2, 520, { size: 26, weight: 800, alpha: seg(t, 4.3, 4.9) * (1 - out), color: '#8892a8', track: 0.35 });
    }
    // 3. the climb
    else if (t < CLIMB1 + 0.5) {
      const i = Math.max(0, climbI), p = seg(t - CLIMB0 - i * STEP, 0, 0.16);
      const final = i === RANKS.length - 1;
      // trail of earlier emblems along the bottom
      for (let k = 0; k < i; k++) icon(k, W / 2 - (i - k) * 74, 560, 60, 0.55 - (i - k) * 0.04);
      const sz = final ? 300 : 250;
      icon(i, W / 2, 300, sz * back(p), 1, final ? 60 : 25);
      text(RANKS[i].name.toUpperCase(), W / 2, 500, { size: final ? 64 : 50, font: final ? 'Cinzel' : 'Inter', color: RANKS[i].color, alpha: p, glow: final ? 30 : 12, track: 0.08 });
      text(rankRange(i).toUpperCase(), W / 2, 620, { size: 22, weight: 800, color: '#8892a8', alpha: p, track: 0.3 });
    }
    // 4. only one
    else if (t < TOP0) {
      const p = seg(t, CLIMB1 + 0.5, CLIMB1 + 0.9), p2 = seg(t, 10.9, 11.3), out = seg(t, TOP0 - 0.3, TOP0);
      text(`${RANKS.length} RANKS.`, W / 2, 250, { size: 84, alpha: p * (1 - out), color: '#f0e6d2', track: 0.04 });
      text('ONLY #1 IS', W / 2, 380, { size: 52, weight: 800, alpha: p2 * (1 - out), color: '#8892a8', track: 0.2 });
      text('AYANOKOJI', W / 2, 470, { size: 104 * (1.2 - 0.2 * easeOut(p2)), font: 'Cinzel', alpha: p2 * (1 - out), color: RANKS[CROWN].color, glow: 50, track: 0.06 });
    }
    // 5. top 3 countdown
    else if (t < TOP0 + TOPSTEP * 3) {
      const k = Math.floor((t - TOP0) / TOPSTEP), place = 3 - k, lt = t - TOP0 - k * TOPSTEP;
      const pl = stats.ladder[place - 1];
      const p = seg(lt, 0, 0.35), out = seg(lt, TOPSTEP - 0.25, TOPSTEP);
      const a = p * (1 - out);
      if (pl) {
        const ri = rankOf(pl.rating, place - 1), col = RANKS[ri].color;
        text(`#${place}`, 330, 360, { size: 260 * (1.3 - 0.3 * easeOut(p)), font: 'Cinzel', alpha: a * 0.9, color: place === 1 ? '#f0c75e' : '#f0e6d2', glow: place === 1 ? 40 : 10, glowColor: '#c8aa6e' });
        const slide = (1 - easeOut(p)) * 80;
        text(shortName(pl).toUpperCase(), 560 + slide, 300, { size: 88, align: 'left', alpha: a, color: '#fff', max: 660, track: 0.02 });
        icon(ri, 600 + slide, 420, 96, a, 18);
        text(RANKS[ri].name.toUpperCase(), 665 + slide, 405, { size: 34, weight: 800, align: 'left', alpha: a, color: col, track: 0.1, max: 520 });
        const shown = Math.round(START + (pl.rating - START) * easeOut(seg(lt, 0.1, 1.1)));
        text(`${shown}  ·  ${pl.wins}–${pl.losses}`, 665 + slide, 448, { size: 26, weight: 800, align: 'left', alpha: a, color: '#8892a8', track: 0.12 });
      } else if (place === 1) {
        text('THE LADDER IS EMPTY', W / 2, 360, { size: 70, alpha: a });
      }
    }
    // 6. the throne
    else if (t < 21.7) {
      const p = seg(t, 19.4, 19.8), out = seg(t, 21.4, 21.7);
      const king = stats.ladder[0];
      text(`${stats.games} GAMES  ·  ${stats.ladder.length} PLAYERS`, W / 2, 230, { size: 40, weight: 800, alpha: seg(t, 19.0, 19.3) * (1 - out), color: '#8892a8', track: 0.2 });
      icon(CROWN, W / 2, 360, 140 * back(p), p * (1 - out), 50);
      if (king) {
        text(`${shortName(king).toUpperCase()} WEARS THE CROWN.`, W / 2, 500, { size: 60, alpha: p * (1 - out), color: RANKS[CROWN].color, glow: 20 });
        text('TAKE IT.', W / 2, 580, { size: 40, weight: 800, alpha: seg(t, 20.4, 20.7) * (1 - out), color: RANKS[CROWN - 1].color, track: 0.3, glow: 20 });
      } else {
        text('THE CROWN IS UNCLAIMED.', W / 2, 500, { size: 62, alpha: p * (1 - out), color: '#f0e6d2' });
      }
    }
    // 7. call to action
    else {
      const p = seg(t, 21.8, 22.3);
      text('QUEUE UP.', W / 2, 270, { size: 130 * (1.25 - 0.25 * easeOut(p)), alpha: p, color: '#fff', glow: 30, glowColor: '#c8aa6e', track: 0.04 });
      text('GRAGAS SUPERSERVER', W / 2, 410, { size: 54, font: 'Cinzel', alpha: seg(t, 22.5, 23), color: '#c8aa6e', glow: 16, track: 0.08 });
      text('conradcsoares.github.io/gragas-superserver', W / 2, 500, { size: 24, weight: 500, alpha: seg(t, 23, 23.5), color: '#8892a8', track: 0.04 });
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    overlay(t);
  }

  // ---------- sound (synthesized, no files) ----------
  function score(ac, out, t0) {
    const master = ac.createGain(); master.gain.value = 0.85;
    const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(out);
    const noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const env = (g, at, peak, dur) => { g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(peak, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + dur); };

    const boom = (at, big = 1) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(140, at); o.frequency.exponentialRampToValueAtTime(32, at + 0.6);
      env(g, at, 0.9 * big, 1.1 * big); o.connect(g); g.connect(master); o.start(at); o.stop(at + 1.3 * big);
      const n = ac.createBufferSource(), f = ac.createBiquadFilter(), ng = ac.createGain();
      n.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 900;
      env(ng, at, 0.35 * big, 0.4); n.connect(f); f.connect(ng); ng.connect(master); n.start(at); n.stop(at + 0.5);
    };
    const tick = (at, k) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = 220 * Math.pow(2, k / 7);
      env(g, at, 0.18, 0.22); o.connect(g); g.connect(master); o.start(at); o.stop(at + 0.25);
    };
    const riser = (a, b) => {
      const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      n.buffer = noiseBuf; n.loop = true; f.type = 'bandpass'; f.Q.value = 4;
      f.frequency.setValueAtTime(300, a); f.frequency.exponentialRampToValueAtTime(5000, b);
      g.gain.setValueAtTime(0.0001, a); g.gain.exponentialRampToValueAtTime(0.25, b - 0.02); g.gain.setValueAtTime(0.0001, b);
      n.connect(f); f.connect(g); g.connect(master); n.start(a); n.stop(b + 0.05);
    };
    // low drone under everything
    const dg = ac.createGain(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 220;
    dg.gain.setValueAtTime(0.0001, t0); dg.gain.exponentialRampToValueAtTime(0.12, t0 + 2); dg.gain.setValueAtTime(0.12, t0 + LEN - 2); dg.gain.exponentialRampToValueAtTime(0.0001, t0 + LEN);
    for (const fq of [55, 55.6, 82.4]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fq; o.connect(lp); o.start(t0); o.stop(t0 + LEN); }
    lp.connect(dg); dg.connect(master);
    // heartbeat pulses during the countdown
    for (let b = TOP0; b < TOP0 + TOPSTEP * 3; b += 0.55) { boom(t0 + b + 0.28, 0.35); }

    HITS.forEach((h, k) => boom(t0 + h, k === HITS.length - 1 || h === CLIMB1 + 0.05 ? 1.4 : 1));
    for (let i = 0; i < RANKS.length; i++) tick(t0 + CLIMB0 + i * STEP, i);
    riser(t0 + 2.3, t0 + 3.2);
    riser(t0 + CLIMB0 + 1, t0 + CLIMB1 + 0.05);
    riser(t0 + 18.6, t0 + 19.4);
    riser(t0 + 20.8, t0 + 21.8);
  }

  // ---------- playback / recording ----------
  let ac = null, raf = 0, recorder = null;
  function play({ record = false } = {}) {
    cancelAnimationFrame(raf);
    if (ac) ac.close();
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const dest = record ? ac.createMediaStreamDestination() : null;
    const t0 = ac.currentTime + 0.15;
    const out = ac.createGain(); out.connect(ac.destination); if (dest) out.connect(dest);
    score(ac, out, t0);
    $('#cover').hidden = true;

    if (record) {
      const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
      const types = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
      const mime = types.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
      const chunks = [];
      recorder = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: 8e6 });
      recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
      recorder.onstop = () => {
        const type = recorder.mimeType || mime || 'video/webm';
        const blob = new Blob(chunks, { type }), a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `gragas-superserver-trailer.${type.includes('mp4') ? 'mp4' : 'webm'}`;
        document.body.appendChild(a); a.click(); a.remove();
        $('#note').textContent = 'Saved. Check your downloads.';
        $('#save').disabled = false; recorder = null;
      };
      recorder.start();
      $('#save').disabled = true;
      $('#note').textContent = 'Recording… keep this tab open until it finishes (25 s).';
    }
    const loop = () => {
      const t = Math.max(0, ac.currentTime - t0);
      frame(Math.min(t, LEN));
      if (t < LEN + 0.2) raf = requestAnimationFrame(loop);
      else if (recorder) recorder.stop();
    };
    loop();
  }

  const ready = Promise.all([loadData().then(loadIcons), document.fonts.load('900 40px Cinzel'), document.fonts.load('900 40px Inter'), document.fonts.load('800 40px Inter')]);
  ready.then(() => frame(3.9));
  $('#cover').onclick = () => ready.then(() => play());
  $('#replay').onclick = () => ready.then(() => play());
  $('#save').onclick = () => {
    if (!window.MediaRecorder || !cv.captureStream) { $('#note').textContent = 'This browser can’t record video. Try Chrome on a computer.'; return; }
    ready.then(() => play({ record: true }));
  };
  // ?t=12.5 freezes on a frame (handy for checking a scene)
  const freeze = parseFloat(new URLSearchParams(location.search).get('t'));
  if (!isNaN(freeze)) ready.then(() => { $('#cover').hidden = true; frame(freeze); });
  </script>
</body>
</html>
